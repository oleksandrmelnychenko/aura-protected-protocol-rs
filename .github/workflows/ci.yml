name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install system dependencies (protobuf compiler for prost-build)
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: "1.96.1"
          components: clippy

      - uses: Swatinem/rust-cache@23bce251a8cd2ffc3c1075eaa2367cf899916d84 # v2.7.3

      - name: cargo check
        run: cargo check --all-targets

      - name: cargo check (with ffi)
        run: cargo check --all-targets --features ffi

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings -A unsafe_code

      - name: cargo clippy (with ffi)
        run: cargo clippy --all-targets --features ffi -- -D warnings -A unsafe_code

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install protobuf compiler (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install protobuf compiler (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install protobuf

      - name: Install protobuf compiler (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $version = "27.3"
          $url = "https://github.com/protocolbuffers/protobuf/releases/download/v${version}/protoc-${version}-win64.zip"
          Invoke-WebRequest -Uri $url -OutFile protoc.zip
          Expand-Archive protoc.zip -DestinationPath "$env:LOCALAPPDATA\protoc"
          "$env:LOCALAPPDATA\protoc\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: "1.96.1"

      - uses: Swatinem/rust-cache@23bce251a8cd2ffc3c1075eaa2367cf899916d84 # v2.7.3

      - name: cargo test
        run: cargo test --release

      - name: cargo test (with ffi)
        run: cargo test --release --features ffi

      # paper_vectors is almost entirely behind the non-default `test-vectors`
      # feature, so the two runs above build it as an empty shell.  Without this
      # step a change to any AAD or wire field leaves the pinned byte vectors
      # stale and CI stays green.
      - name: cargo test (paper vectors)
        run: cargo test --release --features test-vectors --test paper_vectors

  formal:
    name: Formal Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Maude
        run: |
          sudo apt-get update
          sudo apt-get install -y maude

      - name: Install Tamarin Prover (pre-built binary)
        run: |
          curl -fsSL https://github.com/tamarin-prover/tamarin-prover/releases/download/1.10.0/tamarin-prover-1.10.0-linux64-ubuntu.tar.gz \
            -o /tmp/tamarin.tar.gz
          tar xzf /tmp/tamarin.tar.gz -C /tmp
          sudo install /tmp/tamarin-prover /usr/local/bin/
          tamarin-prover --version

      - name: Install ProVerif
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5

      - name: Build ProVerif
        run: |
          opam install proverif -y
          eval $(opam env)
          echo "$(opam var bin)" >> $GITHUB_PATH

      - name: Formal artifact logs
        run: ./scripts/reproduce-paper-artifact.sh formal

      - name: Upload formal artifact logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aura-formal-artifact-${{ github.sha }}
          path: artifact-output/**
          if-no-files-found: warn
          retention-days: 90

  pinned-toolchain:
    name: Pinned Rust (1.96.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.96.1"

      - uses: Swatinem/rust-cache@23bce251a8cd2ffc3c1075eaa2367cf899916d84 # v2.7.3

      - name: cargo check (Rust 1.96.1)
        run: cargo check --all-targets

  fuzz:
    name: Fuzz Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - uses: Swatinem/rust-cache@23bce251a8cd2ffc3c1075eaa2367cf899916d84 # v2.7.3

      - name: Fuzz all targets (10s each)
        run: |
          cd fuzz
          for target in $(cargo +nightly fuzz list 2>/dev/null); do
            echo "::group::Fuzzing $target"
            cargo +nightly fuzz run "$target" -- -max_total_time=10 -max_len=4096 || exit 1
            echo "::endgroup::"
          done

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: "1.96.1"

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run cargo audit
        run: cargo audit
