name: Build & Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g., 1.2.0)'
        required: false
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build-apple-xcframework:
    name: Build XCFramework
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install protobuf compiler
        run: brew install protobuf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-ios-macabi,x86_64-apple-ios-macabi

      - uses: Swatinem/rust-cache@v2

      - name: Build XCFramework
        run: bash scripts/release/build-apple-xcframework.sh

      - name: Compile Swift wrapper against fresh XCFramework
        run: |
          swift build --configuration release
          xcodebuild \
            -scheme AuraProtectedProtocol \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            -derivedDataPath "$RUNNER_TEMP/aura-protected-protocol-catalyst" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - uses: actions/upload-artifact@v4
        with:
          name: apple-xcframework
          path: dist/apple/
          retention-days: 30

  publish-release:
    name: GitHub Release
    needs: [build-apple-xcframework]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Determine version
        id: version
        run: |
          VERSION="${{ github.ref_name }}"
          echo "VERSION=${VERSION#v}" >> $GITHUB_OUTPUT

      - name: Determine SwiftPM checksum
        id: checksum
        run: |
          CHECKSUM="$(cut -d' ' -f1 artifacts/apple-xcframework/AuraProtectedProtocol.xcframework.zip.sha256)"
          echo "CHECKSUM=$CHECKSUM" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/apple-xcframework/AuraProtectedProtocol.xcframework.zip
            artifacts/apple-xcframework/AuraProtectedProtocol.xcframework.zip.sha256
          body: |
            ## Aura Protected Protocol v${{ steps.version.outputs.VERSION }}

            ### Swift Package Manager
            ```swift
            .binaryTarget(
                name: "AuraProtectedProtocol",
                url: "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/AuraProtectedProtocol.xcframework.zip",
                checksum: "${{ steps.checksum.outputs.CHECKSUM }}"
            )
            ```

            ### Platforms
            - macOS arm64
            - iOS (arm64, simulator)
            - Mac Catalyst (arm64, x86_64)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
