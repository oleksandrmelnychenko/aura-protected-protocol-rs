name: Build & Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g., 1.2.0)'
        required: false
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build-apple-xcframework:
    name: Build XCFramework
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install protobuf compiler
        run: brew install protobuf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: Swatinem/rust-cache@v2

      - name: Build Rust FFI for all Apple targets
        run: |
          for target in aarch64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios; do
            cargo rustc --release --features ffi --target "$target" --crate-type staticlib
          done

      - name: Create fat simulator library
        run: |
          lipo -create \
            target/aarch64-apple-ios-sim/release/libaura_protected_protocol.a \
            target/x86_64-apple-ios/release/libaura_protected_protocol.a \
            -output target/libaura_protected_protocol_sim.a

      - name: Create framework bundles with headers
        run: |
          create_framework() {
            local lib="$1" dst="$2"
            local fw="$dst/AuraProtectedProtocolC.framework"
            mkdir -p "$fw/Headers" "$fw/Modules"
            cp "$lib" "$fw/AuraProtectedProtocolC"
            cp include/*.h "$fw/Headers/"
            cp include/module.modulemap "$fw/Modules/"
            cat > "$fw/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleExecutable</key>
            <string>AuraProtectedProtocolC</string>
            <key>CFBundleIdentifier</key>
            <string>ai.auramessenger.AuraProtectedProtocolC</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>AuraProtectedProtocolC</string>
            <key>CFBundlePackageType</key>
            <string>FMWK</string>
            <key>CFBundleShortVersionString</key>
            <string>2.0.0</string>
            <key>CFBundleVersion</key>
            <string>2.0.0</string>
          </dict>
          </plist>
          PLIST
          }
          create_framework target/aarch64-apple-darwin/release/libaura_protected_protocol.a dist/frameworks/macos-arm64
          create_framework target/aarch64-apple-ios/release/libaura_protected_protocol.a     dist/frameworks/ios-arm64
          create_framework target/libaura_protected_protocol_sim.a                           dist/frameworks/ios-sim

      - name: Create XCFramework
        run: |
          mkdir -p dist/apple
          xcodebuild -create-xcframework \
            -framework dist/frameworks/macos-arm64/AuraProtectedProtocolC.framework \
            -framework dist/frameworks/ios-arm64/AuraProtectedProtocolC.framework \
            -framework dist/frameworks/ios-sim/AuraProtectedProtocolC.framework \
            -output dist/apple/AuraProtectedProtocol.xcframework
          cd dist/apple && zip -r AuraProtectedProtocol.xcframework.zip AuraProtectedProtocol.xcframework
          shasum -a 256 AuraProtectedProtocol.xcframework.zip > AuraProtectedProtocol.xcframework.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: apple-xcframework
          path: dist/apple/
          retention-days: 30

  publish-release:
    name: GitHub Release
    needs: [build-apple-xcframework]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Determine version
        id: version
        run: |
          VERSION="${{ github.ref_name }}"
          echo "VERSION=${VERSION#v}" >> $GITHUB_OUTPUT

      - name: Determine SwiftPM checksum
        id: checksum
        run: |
          CHECKSUM="$(cut -d' ' -f1 artifacts/apple-xcframework/AuraProtectedProtocol.xcframework.zip.sha256)"
          echo "CHECKSUM=$CHECKSUM" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/apple-xcframework/AuraProtectedProtocol.xcframework.zip
            artifacts/apple-xcframework/AuraProtectedProtocol.xcframework.zip.sha256
          body: |
            ## Aura Protected Protocol v${{ steps.version.outputs.VERSION }}

            ### Swift Package Manager
            ```swift
            .binaryTarget(
                name: "AuraProtectedProtocol",
                url: "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/AuraProtectedProtocol.xcframework.zip",
                checksum: "${{ steps.checksum.outputs.CHECKSUM }}"
            )
            ```

            ### Platforms
            - macOS arm64
            - iOS (arm64, simulator)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
