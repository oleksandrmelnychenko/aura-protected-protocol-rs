<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
  <defs>
    <marker id="arrow-dark" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#202226"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5f9f"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7953"/>
    </marker>
  </defs>

  <style>
    .serif { font-family: "Times New Roman", Georgia, serif; fill: #151515; }
    .header { font-family: "Times New Roman", Georgia, serif; font-size: 34px; font-weight: 700; fill: #141414; }
    .header-small { font-family: "Times New Roman", Georgia, serif; font-size: 33px; font-weight: 700; fill: #141414; }
    .body { font-family: "Times New Roman", Georgia, serif; font-size: 29px; fill: #141414; }
    .body-bold { font-family: "Times New Roman", Georgia, serif; font-size: 29px; font-weight: 700; fill: #141414; }
    .formula { font-family: "Times New Roman", Georgia, serif; font-size: 29px; font-weight: 700; font-style: italic; fill: #171717; }
    .formula-small { font-family: "Times New Roman", Georgia, serif; font-size: 26px; font-weight: 700; fill: #171717; }
    .formula-small-i { font-family: "Times New Roman", Georgia, serif; font-size: 26px; font-weight: 700; font-style: italic; fill: #171717; }
    .muted-line { stroke: #b8bcc1; stroke-width: 2.2; stroke-dasharray: 9 9; stroke-linecap: round; }
    .dash-dark { stroke: #202226; stroke-width: 3.2; stroke-dasharray: 7 9; stroke-linecap: round; fill: none; marker-end: url(#arrow-dark); }
    .dash-blue { stroke: #1f5f9f; stroke-width: 3.2; stroke-dasharray: 7 9; stroke-linecap: round; fill: none; marker-end: url(#arrow-blue); }
    .dash-green { stroke: #1f7953; stroke-width: 3.2; stroke-dasharray: 7 9; stroke-linecap: round; fill: none; marker-end: url(#arrow-green); }
    .box-header { fill: #f7f7f7; stroke: #1f2225; stroke-width: 2.2; }
    .box-main { fill: #f5f6ff; stroke: #3b435b; stroke-width: 2.1; stroke-dasharray: 10 7; }
    .box-green { fill: #f0faf1; stroke: #1f7953; stroke-width: 2.1; stroke-dasharray: 10 7; }
    .frame { fill: #ffffff; stroke: #111111; stroke-width: 2.6; stroke-dasharray: 13 11; stroke-linecap: round; }
    .label-bg { fill: #ffffff; opacity: 0.95; }
  </style>

  <rect x="0" y="0" width="1600" height="820" fill="#ffffff"/>
  <rect class="frame" x="28" y="28" width="1544" height="764" rx="18" ry="18"/>

  <!-- participant lifelines -->
  <line class="muted-line" x1="280" y1="145" x2="280" y2="752"/>
  <line class="muted-line" x1="800" y1="145" x2="800" y2="752"/>
  <line class="muted-line" x1="1280" y1="145" x2="1280" y2="752"/>

  <!-- participant headers -->
  <rect class="box-header" x="125" y="60" width="310" height="82" rx="7"/>
  <text class="header" x="280" y="111" text-anchor="middle">Initiator <tspan font-style="italic">I</tspan></text>

  <rect class="box-header" x="650" y="52" width="300" height="98" rx="7"/>
  <text class="header-small" x="800" y="93" text-anchor="middle">Pre-key</text>
  <text class="header-small" x="800" y="130" text-anchor="middle">directory</text>

  <rect class="box-header" x="1125" y="60" width="310" height="82" rx="7"/>
  <text class="header" x="1280" y="111" text-anchor="middle">Responder <tspan font-style="italic">R</tspan></text>

  <!-- publish from responder to directory -->
  <rect class="label-bg" x="875" y="150" width="350" height="62" rx="4"/>
  <text class="formula-small" x="1050" y="174" text-anchor="middle">publish signed SPK, OPKs,</text>
  <text class="formula-small" x="1050" y="204" text-anchor="middle">identity keys, <tspan font-style="italic">kpk</tspan><tspan baseline-shift="sub" font-size="70%">R</tspan></text>
  <line class="dash-dark" x1="1280" y1="223" x2="800" y2="223"/>

  <!-- fetch bundle request/response -->
  <rect class="label-bg" x="425" y="244" width="310" height="38" rx="4"/>
  <text class="formula-small-i" x="540" y="272" text-anchor="middle">FetchBundle(<tspan>R</tspan>)</text>
  <line class="dash-dark" x1="400" y1="286" x2="680" y2="286"/>

  <line class="dash-dark" x1="680" y1="355" x2="400" y2="355"/>
  <rect class="label-bg" x="445" y="364" width="230" height="66" rx="4"/>
  <text class="formula-small" x="540" y="392" text-anchor="middle">validated</text>
  <text class="formula-small-i" x="540" y="423" text-anchor="middle">Bundle<tspan baseline-shift="sub" font-size="70%">R</tspan></text>

  <!-- computation boxes -->
  <rect class="box-main" x="70" y="450" width="430" height="136" rx="8"/>
  <text class="body-bold" x="285" y="489" text-anchor="middle">4 X25519 DH values</text>
  <text class="body-bold" x="285" y="526" text-anchor="middle">+ ML-KEM encapsulation</text>
  <text class="formula" x="285" y="565" text-anchor="middle">HKDF → rk₀, mdk₀, sid</text>

  <rect class="box-green" x="1050" y="452" width="400" height="110" rx="8"/>
  <text class="body-bold" x="1250" y="496" text-anchor="middle">same DH/KEM combiner</text>
  <text class="body-bold" x="1250" y="535" text-anchor="middle">after decapsulation</text>

  <!-- init message -->
  <text class="formula" x="800" y="568" text-anchor="middle">
    <tspan>Init: EK</tspan><tspan baseline-shift="sub" font-size="70%">I</tspan><tspan baseline-shift="super" font-size="70%">pub</tspan><tspan>, ct</tspan><tspan baseline-shift="sub" font-size="70%">ky</tspan><tspan>, kpk</tspan><tspan baseline-shift="sub" font-size="70%">I</tspan>
  </text>
  <text class="formula" x="800" y="604" text-anchor="middle">
    <tspan>σ</tspan><tspan baseline-shift="sub" font-size="70%">I</tspan><tspan baseline-shift="super" font-size="70%">bind</tspan><tspan>, mac</tspan><tspan baseline-shift="sub" font-size="70%">I</tspan>
  </text>
  <line class="dash-dark" x1="280" y1="626" x2="1280" y2="626"/>

  <!-- ack message -->
  <line class="dash-dark" x1="1280" y1="705" x2="280" y2="705"/>
  <rect class="label-bg" x="690" y="716" width="230" height="42" rx="5"/>
  <text class="formula" x="800" y="744" text-anchor="middle">Ack: mac<tspan baseline-shift="sub" font-size="70%">R</tspan></text>
</svg>
