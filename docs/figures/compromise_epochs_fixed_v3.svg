<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="640" viewBox="0 0 1500 640">
  <defs>
    <style>
      .page { fill: #ffffff; }
      .frame { fill: none; stroke: #111; stroke-width: 3; stroke-dasharray: 14 10; }
      .box { fill: #fff; stroke: #222; stroke-width: 2.4; }
      .green { fill: #edf8ec; }
      .pink { fill: #f8ebeb; }
      .beige { fill: #f7f1e7; }
      .circle { fill: #fff; stroke: #222; stroke-width: 2.4; }
      .line { stroke: #111; stroke-width: 3.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .text { font-family: 'Times New Roman', Times, serif; fill: #111; }
      .t1 { font-size: 31px; }
      .t2 { font-size: 33px; }
      .t3 { font-size: 29px; }
      .math { font-style: italic; }
    </style>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L14,7 L0,14 z" fill="#111"/>
    </marker>
  </defs>

  <rect class="page" x="0" y="0" width="1500" height="640"/>
  <rect class="frame" x="22" y="22" rx="18" ry="18" width="1456" height="596"/>

  <!-- Top callout -->
  <rect class="box green" x="505" y="42" rx="12" ry="12" width="500" height="150"/>
  <text class="text t2" x="755" y="92" text-anchor="middle">local compromise:</text>
  <text class="text t2" x="755" y="136" text-anchor="middle">classical PCS after</text>
  <text class="text t2" x="755" y="176" text-anchor="middle">first honest directed step</text>

  <!-- Timeline -->
  <circle class="circle" cx="170" cy="305" r="40"/>
  <text class="text t2 math" x="170" y="319" text-anchor="middle">e</text>

  <circle class="circle" cx="735" cy="305" r="48"/>
  <text class="text t2 math" x="735" y="320" text-anchor="middle">e + 1</text>

  <circle class="circle" cx="1225" cy="305" r="48"/>
  <text class="text t2 math" x="1225" y="320" text-anchor="middle">e + 2</text>

  <line class="line" x1="210" y1="305" x2="670" y2="305" marker-end="url(#arrow)"/>
  <line class="line" x1="783" y1="305" x2="1158" y2="305" marker-end="url(#arrow)"/>

  <!-- Bottom row -->
  <rect class="box pink" x="65" y="425" rx="10" ry="10" width="385" height="112"/>
  <text class="text t2" x="257.5" y="495" text-anchor="middle">state compromise</text>

  <rect class="box beige" x="535" y="412" rx="10" ry="10" width="430" height="126"/>
  <text class="text t2" x="750" y="474" text-anchor="middle">two-endpoint compromise:</text>
  <text class="text t2" x="750" y="514" text-anchor="middle">no first-step hybrid claim</text>

  <rect class="box green" x="1045" y="388" rx="10" ry="10" width="360" height="154"/>
  <text class="text t1" x="1225" y="450" text-anchor="middle">hybrid recovery after</text>
  <text class="text t1" x="1225" y="491" text-anchor="middle">post-compromise peer</text>
  <text class="text t1" x="1225" y="532" text-anchor="middle">DH + KEM material</text>

  <!-- Bottom arrows with clear spacing -->
  <line class="line" x1="450" y1="481" x2="520" y2="481" marker-end="url(#arrow)"/>
  <line class="line" x1="965" y1="481" x2="1030" y2="481" marker-end="url(#arrow)"/>

  <!-- Diagonal arrow -->
  <line class="line" x1="275" y1="425" x2="595" y2="210" marker-end="url(#arrow)"/>
</svg>
